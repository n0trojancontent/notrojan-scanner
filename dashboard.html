<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Trojan Academy — Dashboard</title>
<style>
  :root{
    --bg:#04070a; --panel:#0a1410; --line:#16241c;
    --green:#37e07a; --green-dim:#1f8f4e; --red:#e0403a;
    --ink:#dcefe2; --muted:#7f9d8b; --chip:#0e1b14;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 500px at 50% -10%, rgba(55,224,122,.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    padding:0 16px 48px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px;border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:.12em;color:var(--red);font-size:17px}
  .brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-top:4px}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .role{padding:4px 10px;border:1px solid var(--green-dim);border-radius:999px;color:var(--green);font-size:11px;text-transform:capitalize}
  .signout{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
  h2{font-size:14px;color:var(--muted);font-weight:600;margin:26px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .tile h3{margin:0 0 6px;font-size:15px}
  .tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink)}
  .belt{display:flex;align-items:center;gap:12px}
  .beltdot{width:34px;height:34px;border-radius:8px;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--green);text-transform:capitalize}
  .cta{display:inline-block;margin-top:6px;background:var(--green);color:#04120a;font-weight:700;border:none;border-radius:10px;padding:12px 18px;font-size:14px;cursor:pointer;text-decoration:none}
  .cta:hover{background:#45ef88}
  .cta[disabled]{opacity:.5;cursor:default}
  .empty{color:var(--muted);font-size:13px}
  .muted{color:var(--muted);font-size:12px;margin-top:8px}
  .coderow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .coderow b{color:var(--green);font-family:ui-monospace,Consolas,monospace}
</style>
</head>

      <div class="who">
        <span id="acct"></span>
        <span class="role" id="role"></span>
        <button class="signout" id="signout">Sign out</button>
      </div>
    </header>

    <div id="view"></div>
  </div>

<script>
  // Point this at your deployed Academy Worker (same as login.html).
  const API = "https://notrojan-academy.YOUR-SUBDOMAIN.workers.dev";

  const token = sessionStorage.getItem("not_token");
  const role = sessionStorage.getItem("not_role");
  if (!token) { window.location.href = "login.html"; }

  document.getElementById("signout").addEventListener("click", function(){
    sessionStorage.clear();
    window.location.href = "login.html";
  });

  const DOMAINS = [
    "Media, Information & Digital Literacy",
    "Ethical Operating Systems & Cultural Responsibility",
    "Green Content & Influence Stewardship",
    "Domain 4",
  ];

  function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

  function renderProducts(products){
    if (!products || !products.length) return '<p class="empty">No products are licensed to this account yet.</p>';
    return '<div class="chips">' + products.map(function(p){
      return '<span class="chip">' + String(p.product) + '</span>';
    }).join("") + '</div>';
  }

  async function load(){
    const view = document.getElementById("view");
    try{
      const res = await fetch(API + "/me", { headers: { "authorization": "Bearer " + token } });
      const d = await res.json();
      if (!d.ok){ window.location.href = "login.html"; return; }

      document.getElementById("acct").textContent = d.account || "";
      document.getElementById("role").textContent = (d.role === "ta") ? "assistant" : d.role;

      let html = "";
      html += '<h2>Your access</h2>' + renderProducts(d.products);

      if (d.role === "student"){
        html += '<h2>Your progress</h2>';
        html += '<div class="tile"><div class="belt"><div class="beltdot">' + (d.belt || "white") + '</div>'
             + '<div><h3 style="margin:0">Belt: ' + (d.belt || "white") + '</h3>'
             + '<p>Cohort: ' + (d.cohort || "") + '</p></div></div>'
             + '<p class="muted">Credentials open as you clear each Domain.</p></div>';
        html += '<h2>Start learning</h2>';
        html += '<div class="tile"><h3>' + DOMAINS[0] + '</h3><p>Begin Domain 1, the base of the ladder.</p>'
             + '<a class="cta" href="domain1.html">Enter Domain 1</a></div>';
      }
      else if (d.role === "ta"){
        html += '<h2>Cohort</h2><div class="tile"><h3>' + (d.cohort || "Cohort") + '</h3>'
             + '<p>You are signed in as an assistant. You can support learners in this cohort.</p>'
             + '<a class="cta" href="domain1.html">Enter Domain 1</a></div>';
      }
      else { // teacher / user
        html += '<h2>Your cohorts</h2>';
        if (d.cohorts && d.cohorts.length){
          html += '<div class="tile">' + d.cohorts.map(function(c){
            return '<div class="coderow"><span>' + c.name + '</span><b>' + c.class_code + '</b></div>';
          }).join("") + '<p class="muted">Generate day subcodes and manage rosters from each cohort.</p></div>';
        } else {
          html += '<div class="tile"><p class="empty">No cohorts yet. Create your first cohort to issue subcodes and register learners.</p></div>';
        }
        html += '<h2>Curriculum</h2><div class="tile"><h3>' + DOMAINS[0] + '</h3><p>Preview Domain 1 before your session.</p>'
             + '<a class="cta" href="domain1.html">Enter Domain 1</a></div>';
      }

      view.innerHTML = html;
    } catch(e){
      view.innerHTML = '<p class="empty">The dashboard could not load. Refresh, or sign in again.</p>';
    }
  }

  if (token) load();
</script>
